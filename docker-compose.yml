services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee_api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://employee_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/employee_db
      APP_NAME: Employee Operations Platform
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: employee_db
    environment:
      POSTGRES_DB: employee_db
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_user -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:

